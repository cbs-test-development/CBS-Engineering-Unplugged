<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBS Engineering Unplugged</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-bg" style="background-image: url('images/hero.png');"></div>
  <img class="hero-fg" src="images/hero.png" alt="CBS Engineering Unplugged">
</div>

<main>
  <h1 id="about-title"></h1>
  <p class="tagline" id="about-tagline"></p>

  <section id="about-paragraphs"></section>

  <div class="card countdown-card" id="countdown-card">
    <div class="countdown-label" id="countdown-label">Next Session</div>
    <div class="countdown-timer" id="countdown-timer"></div>
    <div class="countdown-sub" id="countdown-sub"></div>
  </div>

  <h2>Cadence &amp; Logistics</h2>
  <div class="card">
    <ul class="logistics-list" id="logistics-list"></ul>
  </div>

  <h2>Upcoming Session</h2>
  <div class="card upcoming-card" id="upcoming-card"></div>

  <h2>Session Archive</h2>
  <div class="table-wrap">
    <table id="archive-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Topic</th>
          <th>Presenter</th>
          <th>Recording</th>
          <th>Slides</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>Proposed Upcoming Topics and Speakers</h2>
  <p class="muted-text">May change based on speaker availability</p>
  <div class="table-wrap">
    <table id="proposed-table">
      <thead>
        <tr>
          <th>Presenter</th>
          <th>Topic</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<footer></footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
